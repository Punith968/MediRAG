name: Quality

on:
  push:
    branches: ["main", "chore/**", "feature/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi==0.111.0" "openai==1.50.0" "slowapi==0.1.9" "Pillow==10.1.0" "redis==5.0.8" "numpy==1.26.4" "torch==2.2.2" "pinecone-client==5.0.1" "sentence-transformers==3.0.1" "transformers==4.41.2" "python-dotenv==1.0.0" "PyMuPDF==1.23.6" "networkx==3.2.1" "pydantic-settings==2.2.1" pytest
      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
